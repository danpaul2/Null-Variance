version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
    environment:
      - JWT_SECRET_KEY=change-me-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=480
    networks:
      - nawi-net

  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - nawi-net

volumes:
  backend-uploads:
  frontend-node-modules:

networks:
  nawi-net:
    driver: bridge
